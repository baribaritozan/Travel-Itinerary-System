name: Publish itinerary

on:
  workflow_dispatch:
    inputs:
      trip_slug:
        description: Trips DBのSlug
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_TRIPS_DATA_SOURCE_ID: ${{ vars.NOTION_TRIPS_DATA_SOURCE_ID }}
      NOTION_PLACES_DATA_SOURCE_ID: ${{ vars.NOTION_PLACES_DATA_SOURCE_ID }}
      NOTION_ITEMS_DATA_SOURCE_ID: ${{ vars.NOTION_ITEMS_DATA_SOURCE_ID }}
      TRIP_SLUG: ${{ inputs.trip_slug }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test
        run: npm test
      - name: Build static site from Notion
        run: npm run build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME }}
